name: AI Content Factory Pipeline

on:
  schedule:
    - cron: '0 6 * * *' # Daily at 6:00 AM UTC
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.1.0

      - name: Install Workspace Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run AI Generation & Notion Sync
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "Initiating daily AI generation cron..."
          # In production, this runs a script or routes to next.js api
          curl -X POST http://localhost:3000/api/content/generate \
            -H "Content-Type: application/json" \
            -d '{"projectId": "proj_local_dentist", "topic": "How to optimize dental crowns", "keyword": "dental crowns"}'
